general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = wlopm --on \*
}

# 5 Minutes: Turn off displays (optional, saves power if away briefly)
listener {
    timeout = 300
    on-timeout = wlopm --off \*
    on-resume = wlopm --on \*
}

# 10 Minutes (600s): Lock screen and suspend
listener {
    timeout = 600
    on-timeout = loginctl lock-session && sleep 1 && systemctl suspend
    on-resume = wlopm --on \*
}
